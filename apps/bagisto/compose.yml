# Bagisto on ePHPm + MariaDB.
#
#   docker compose up -d
#   open http://localhost:8080          the shop
#   open http://localhost:8080/admin    BAGISTO_ADMIN_EMAIL / BAGISTO_ADMIN_PASSWORD
#                                       (default admin@example.com / admin123 — change it)
#
# Replaces: a nginx/apache + php-fpm host (and the cron entry for the
# Laravel scheduler).

services:
  ephpm:
    build: .
    image: recipes-bagisto
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment: &env
      # The URL users open the shop at (links, assets and image URLs are built from it).
      APP_URL: ${APP_URL:-http://localhost:${EPHPM_PORT:-8080}}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: UTC
      APP_ADMIN_URL: admin
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bagisto
      DB_USERNAME: bagisto
      DB_PASSWORD: bagisto
      LOG_CHANNEL: stderr
      # Bagisto's default mailer is SMTP to 127.0.0.1:2525; log mail until
      # you configure a real one.
      MAIL_MAILER: log
      # The admin account the first start creates. Unset, the installer's
      # default admin@example.com / admin123 is kept — change it.
      BAGISTO_ADMIN_EMAIL: ${BAGISTO_ADMIN_EMAIL:-}
      BAGISTO_ADMIN_PASSWORD: ${BAGISTO_ADMIN_PASSWORD:-}
      # Cache and sessions default to the database. To keep them in ePHPm's
      # in-process KV store instead, uncomment:
      # CACHE_STORE: redis
      # SESSION_DRIVER: redis
      # REDIS_CLIENT: predis
      # REDIS_HOST: 127.0.0.1
    volumes:
      - storage:/app/storage   # product images, logs, .env (APP_KEY), the installed marker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Bagisto's scheduled jobs (indexers, catalog rule prices, invoice
  # reminders) run through the Laravel scheduler, which upstream asks you to
  # call from cron every minute.
  scheduler:
    image: recipes-bagisto
    command: ["sh", "-c", "while :; do ephpm php artisan schedule:run; sleep 60; done"]
    environment: *env
    volumes:
      - storage:/app/storage
    depends_on:
      ephpm:
        condition: service_started
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: bagisto
      MARIADB_USER: bagisto
      MARIADB_PASSWORD: bagisto
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  storage:
  db-data:
