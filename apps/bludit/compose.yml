# Bludit on ePHPm (single container, flat files).
#   BLUDIT_ADMIN_PASSWORD='something-long' docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port); admin at /admin
services:
  ephpm:
    build: .
    image: recipes-bludit
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      # First start only: the password of the `admin` user. If unset, the
      # installer is left to the browser (open the site once to run it).
      BLUDIT_ADMIN_PASSWORD: ${BLUDIT_ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - content:/var/www/html/bl-content   # pages, databases, uploads, plugins config
    restart: unless-stopped

volumes:
  content:
