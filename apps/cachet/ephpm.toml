# ePHPm configuration for Cachet 3 (MySQL/MariaDB, PostgreSQL or SQLite).
#
# Cachet (Laravel 13 + Filament) talks to its database itself; ePHPm is the
# web server + PHP runtime. Every key is documented at
# https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Laravel's web root is public/; the application code sits above it.
document_root = "/app/public"
index_files = ["index.php"]
# Cachet's nginx config: try_files $uri $uri/ /index.php?$query_string
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 16777216            # 16 MiB — logo/favicon uploads

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# PHP never runs from the public uploads (public/storage -> storage/app/public).
blocked_paths = ["/storage/*.php*", "/storage/*.phtml", "/*.htaccess"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 60
memory_limit = "256M"
ini_overrides = [
    # v0.11.3 still inherits PHP's compiled-in display_errors=1 under `ephpm serve`;
    # keep warnings out of responses and in the container log
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "16M"],
    ["post_max_size", "16M"],
]

# Loopback RESP listener so `ephpm cache reset` (OPcache refresh after an
# upgrade) and `ephpm kv ...` can reach the in-process store. Not published
# outside the container.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
