# ePHPm configuration for Castopod — external database (MariaDB/MySQL).
#
# Castopod reads its configuration from /app/.env (written by entrypoint.sh
# from the same CP_* variables the official image uses); ePHPm is the web
# server + PHP runtime. Every key is documented at
# https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/app/public"
index_files = ["index.php"]
# CodeIgniter 4 front controller: the official FrankenPHP/Caddy setup and
# Castopod's own nginx example both route everything not on disk to index.php.
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.timeouts]
request = 600                       # audio uploads and processing

[server.request]
max_body_size = 536870912           # 512 MiB — the official PHP_POST_MAX_SIZE default

[server.static]
cache_control = "public, max-age=604800"   # built assets are hashed; media is immutable

[server.security]
# writable/ holds sessions, logs and the cache; media/ is an upload volume.
blocked_paths = ["/media/*.php*", "/media/*.phar", "/media/*.phtml", "/.htaccess"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 300            # the official PHP_MAX_EXECUTION_TIME default
memory_limit = "512M"               # the official PHP_MEMORY_LIMIT default
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    ["upload_max_filesize", "512M"],    # the official PHP_UPLOAD_MAX_FILE_SIZE default
    ["post_max_size", "512M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container (OPcache timestamp
# validation is off under `ephpm serve`; reset after changing PHP files).
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
