# ePHPm configuration for CodeIgniter 4 — per-request mode.
# Keys: https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/app/public"
index_files = ["index.php"]
# public/.htaccess: RewriteRule ^([\s\S]*)$ index.php/$1 — the query-string
# form below is what CI4's URI handling expects from nginx too.
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 33554432

[server.static]
cache_control = "public, max-age=3600"

[server.security]
blocked_paths = ["/.env", "/writable/*", "/vendor/*", "/app/*"]
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 60
memory_limit = "256M"

# Loopback RESP listener: `ephpm cache reset` after deploys, and CI4's Redis
# cache/session handlers can target 127.0.0.1:6379 with predis.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
