# ePHPm configuration for FileGator.
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# The official image's Apache DocumentRoot: dist/ holds index.php (every API
# call is `/?r=/<route>`) and the built frontend; the code, the private
# directory and the repository sit above it and are never served.
document_root = "/var/www/filegator/dist"
index_files = ["index.php"]
fallback = ["$uri", "$uri/", "=404"]

[server.request]
# The frontend uploads in 1 MiB chunks (frontend_config.upload_chunk_size);
# leave room for a larger chunk size.
max_body_size = 104857600           # 100 MiB

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# index.php is the only PHP file in dist/. Patterns are matched against the
# request URI (issues/shaarli.md), so "/" is listed too.
allowed_php_paths = ["/", "/index.php"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 300            # zipping / unzipping large selections
memory_limit = "256M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "100M"],
    ["post_max_size", "100M"],
]

[server.timeouts]
request = 360                       # above [php] max_execution_time
