# ePHPm configuration for Firefly III (MySQL/MariaDB database).
#
# Firefly III (Laravel 12) connects to DB_HOST with pdo_mysql; ePHPm is the
# web server + PHP runtime. Every key is documented at
# https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Laravel's web root is public/; the application code sits above it.
document_root = "/app/public"
index_files = ["index.php"]
# nginx try_files equivalent (Firefly's own nginx_app.conf rewrites every
# non-file URL to the front controller the same way).
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 67108864            # 64 MiB — attachment uploads and imports

[server.static]
cache_control = "public, max-age=86400"

[php]
max_execution_time = 300            # the official image sets PHP_MAX_EXECUTION_TIME=300 (reports, imports)
memory_limit = "512M"
ini_overrides = [
    ["upload_max_filesize", "64M"],
    ["post_max_size", "64M"],
]

# Loopback RESP listener so `ephpm cache reset` (OPcache refresh after an
# upgrade) and `ephpm kv ...` can reach the in-process store. Not published
# outside the container. With CACHE_STORE=redis / SESSION_DRIVER=redis and
# REDIS_HOST=127.0.0.1 Firefly III uses it instead of a Redis service.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
