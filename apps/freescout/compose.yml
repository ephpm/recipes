# FreeScout on ePHPm + MariaDB.
#
#   docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port — keep
#                                 APP_URL in sync with it)
#   log in with FREESCOUT_ADMIN_EMAIL / FREESCOUT_ADMIN_PASSWORD
#
# Replaces: Apache/nginx + php-fpm + the `* * * * * php artisan schedule:run`
# crontab entry (which also keeps FreeScout's queue worker alive). Here the
# scheduler and the queue worker are two sidecars running the same image.

x-freescout-env: &fs-env
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: freescout
  DB_USERNAME: freescout
  DB_PASSWORD: ${DB_PASSWORD:-freescout-db-password}
  # Behind a TLS-terminating proxy: APP_FORCE_HTTPS: "true"

services:
  ephpm:
    build: .
    image: recipes-freescout
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      <<: *fs-env
      FREESCOUT_ADMIN_EMAIL: ${FREESCOUT_ADMIN_EMAIL:-admin@example.com}
      FREESCOUT_ADMIN_PASSWORD: ${FREESCOUT_ADMIN_PASSWORD:-FreeScout-Admin-Pass-1}
    volumes:
      - storage:/app/storage          # .env (APP_KEY), attachments, logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: recipes-freescout
    command: ["scheduler"]
    environment: *fs-env
    volumes:
      - storage:/app/storage
    depends_on:
      - ephpm
    restart: unless-stopped

  queue:
    image: recipes-freescout
    command: ["queue"]
    environment: *fs-env
    volumes:
      - storage:/app/storage
    depends_on:
      - ephpm
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: freescout
      MARIADB_USER: freescout
      MARIADB_PASSWORD: ${DB_PASSWORD:-freescout-db-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-freescout-root-password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  storage:
  db-data:
