# ePHPm configuration for FreeScout (Laravel 5.5, MySQL/MariaDB).
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# FreeScout's web root is public/; the root .htaccess only rewrites into it.
document_root = "/app/public"
index_files = ["index.php"]
# public/.htaccess: anything that is not a file or directory → index.php
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 41943040            # 40 MiB attachments

[server.timeouts]
request = 600                       # above max_execution_time, so PHP's own timeout fires first

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 300
memory_limit = "256M"
# FreeScout updates itself and installs modules from the web UI, and
# rewrites its cached config when settings change: let OPcache notice
# changed files (PHP's stock 2-second interval) instead of `ephpm serve`'s
# default of never checking.
opcache_validate_timestamps = true
opcache_revalidate_freq = 2
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "40M"],
    ["post_max_size", "40M"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` work
# inside the container. Not published.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
