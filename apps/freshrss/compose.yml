# FreshRSS on ePHPm + PostgreSQL (the database the official compose example uses).
#
#   docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port)
#
# Replaces: Apache + mod_php + crond (the freshrss/freshrss image).
# The admin user is created on first start from FRESHRSS_USER; change
# ADMIN_PASSWORD / ADMIN_API_PASSWORD (or put them in a .env file, the same
# variable names as FreshRSS's own Docker/freshrss/example.env).

services:
  ephpm:
    build: .
    image: recipes-freshrss
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
      # Refresh all feeds at these minutes of every hour (empty = no refresh job)
      CRON_MIN: "2,32"
      # FRESHRSS_ENV: development
      # Hosts on your internal network that feeds may point at (space-separated
      # host:port or CIDR); everything internal is refused otherwise.
      # INTERNAL_HOST_ALLOWLIST: rss-bridge:80
      # One-time setup, only used at the very first start (cli/do-install.php
      # arguments). Delete the `data` volume to run it again.
      FRESHRSS_INSTALL: |-
        --api-enabled
        --db-base freshrss
        --db-host db
        --db-password freshrss
        --db-type pgsql
        --db-user freshrss
        --default-user admin
        --language en
      # cli/create-user.php arguments, same rule.
      FRESHRSS_USER: |-
        --api-password ${ADMIN_API_PASSWORD:-freshrss}
        --email ${ADMIN_EMAIL:-admin@example.net}
        --language en
        --password ${ADMIN_PASSWORD:-freshrss}
        --user admin
    volumes:
      - data:/var/www/FreshRSS/data
      - extensions:/var/www/FreshRSS/extensions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: freshrss
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: freshrss
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshrss -d freshrss"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  data:
  extensions:
  db-data:
