# ePHPm configuration for Invoice Ninja v5 (MySQL/MariaDB database).
#
# Invoice Ninja (Laravel) connects to DB_HOST with pdo_mysql; ePHPm is the
# web server + PHP runtime. Every key is documented at
# https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Laravel's web root is public/; the application code sits above it.
document_root = "/app/public"
index_files = ["index.php"]
# nginx try_files equivalent (the official nginx config uses the same chain).
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 104857600           # 100 MiB — document uploads, imports, backups

[server.timeouts]
request = 600                       # exports and imports

[server.static]
cache_control = "public, max-age=86400"

[php]
max_execution_time = 300
memory_limit = "512M"               # upstream recommends 512M+
ini_overrides = [
    # v0.11.3 still inherits PHP's compiled-in display_errors=1 under `ephpm serve`;
    # keep warnings out of responses and in the container log
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "100M"],
    ["post_max_size", "100M"],
]

# Loopback RESP listener so `ephpm cache reset` (OPcache refresh after an
# upgrade) and `ephpm kv ...` can reach the in-process store. Not published
# outside the container. With CACHE_DRIVER=redis / SESSION_DRIVER=redis,
# REDIS_CLIENT=predis and REDIS_HOST=127.0.0.1 Invoice Ninja uses it instead
# of a Redis service.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
