# ePHPm configuration for InvoicePlane — external database (MySQL/MariaDB).
#
# InvoicePlane connects straight to DB_HOSTNAME with mysqli; ePHPm is the web
# server + PHP runtime. Every key is documented at
# https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"
index_files = ["index.php", "index.html"]
# nginx: try_files $uri $uri/ /index.php$is_args$args — the front-controller
# rewrite that lets REMOVE_INDEXPHP=true work.
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.timeouts]
request = 600                       # upstream nginx: fastcgi_read_timeout 600 (PDF generation)

[server.request]
max_body_size = 67108864            # 64 MiB uploads (keep in sync with the ini below)

[server.static]
cache_control = "public, max-age=3600"

[server.security]
# What the upstream nginx config and the shipped .htaccess files deny:
# application code, vendor, session/log/cache storage, the config file.
blocked_paths = [
    "/application/*",
    "/vendor/*",
    "/storage/*",
    "/ipconfig.php*",
    "/composer.*",
    "/uploads/*.php",
]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 300            # PDF generation (mPDF) can be slow
memory_limit = "256M"
ini_overrides = [
    ["upload_max_filesize", "64M"],
    ["post_max_size", "64M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container (OPcache timestamp
# validation is off under `ephpm serve`; reset after changing PHP files).
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
