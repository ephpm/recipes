# Joomla on ePHPm + MariaDB.
#
#   docker compose up -d
#   open http://localhost:8080                  (EPHPM_PORT overrides the host port)
#   open http://localhost:8080/administrator/   (JOOMLA_ADMIN_USERNAME / _PASSWORD)
#
# Replaces: the official `joomla` image (Apache + mod_php). Same JOOMLA_*
# variables; with the site/admin ones set, Joomla installs itself on the
# first start (otherwise the web installer runs).

services:
  ephpm:
    build: .
    image: recipes-joomla
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomla-db-password}
      JOOMLA_DB_NAME: joomla
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME:-Joomla on ePHPm}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER:-Site Administrator}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME:-admin}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD:-joomla-admin-password}   # longer than 12 characters
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL:-admin@example.com}
      # JOOMLA_SMTP_HOST: mail:25
      # JOOMLA_EXTENSIONS_URLS: "https://.../ext.zip;https://.../other.zip"
    volumes:
      - site:/var/www/html          # the whole Joomla tree (extensions, images, configuration.php)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: joomla
      MARIADB_USER: joomla
      MARIADB_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomla-db-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-joomla-root-password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  site:
  db-data:
