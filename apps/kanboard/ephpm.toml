# ePHPm configuration for Kanboard — external database (MySQL/MariaDB or
# PostgreSQL) or Kanboard's own built-in SQLite.
#
# Kanboard talks to the database itself with PDO; ePHPm is the web server +
# PHP runtime. Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/app"
index_files = ["index.php", "index.html"]
# docker/etc/nginx/nginx.conf: try_files $uri $uri/ /index.php$is_args$args
# (pretty URLs — set ENABLE_URL_REWRITE=true so Kanboard generates them).
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 33554432            # 32 MiB attachments (nginx client_max_body_size 32M)

[server.static]
cache_control = "public, max-age=604800"    # nginx: expires 7d on static assets

[server.security]
# The official nginx config executes only index.php, jsonrpc.php and
# healthcheck.php and answers 404 for app/ libs/ vendor/ data/, the cli
# script, every other .php, and *.log / *.sqlite. Same here (403 instead of
# 404; dot-files are refused by [server.static] hidden_files = "deny").
blocked_paths = ["/app/*", "/libs/*", "/vendor/*", "/data/*", "/cli",
                 "/config.php", "/config.default.php",
                 "/plugins/*/*.php", "/plugins/*/*/*.php", "/plugins/*/*/*/*.php",
                 "/*.log", "/*.sqlite"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 60
memory_limit = "256M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "32M"],
    ["post_max_size", "32M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container. Not published outside it.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
