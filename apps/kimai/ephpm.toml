# ePHPm configuration for Kimai — external database (MariaDB/MySQL).
#
# Kimai reads its configuration from the environment (DATABASE_URL etc.,
# the same variables the official kimai/kimai2 image uses); ePHPm is the web
# server + PHP runtime. Every key is documented at
# https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/opt/kimai/public"
index_files = ["index.php"]
# Symfony front controller (public/.htaccess: RewriteCond !-f → index.php).
fallback = ["$uri", "/index.php?$query_string"]

[server.request]
max_body_size = 67108864            # 64 MiB — invoice/export uploads, plugins

[server.static]
cache_control = "public, max-age=86400"   # public/build assets are content-hashed

[server.security]
# nginx/apache would 404 a URL naming the front controller explicitly, and
# .htaccess is not read here.
blocked_paths = ["/.htaccess"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "512M"               # the official image's memory_limit default
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    ["upload_max_filesize", "64M"],
    ["post_max_size", "64M"],
    ["date.timezone", "UTC"],
    ["session.gc_maxlifetime", "604800"],   # 7 days, as in the official image
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container (OPcache timestamp
# validation is off under `ephpm serve`; reset after installing a plugin).
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
