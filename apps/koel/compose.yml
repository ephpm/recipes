# Koel on ePHPm + MariaDB.
#
#   docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port)
#   log in as admin@koel.dev / KoelIsCool and change it
#   put music under the `music` volume (or bind-mount a directory at /music)
#
# Replaces: the phanan/koel image (Apache + mod_php + cron + ffmpeg).

services:
  ephpm:
    build: .
    image: recipes-koel
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment: &env
      APP_URL: ${APP_URL:-http://localhost:${EPHPM_PORT:-8080}}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: koel
      DB_USERNAME: koel
      DB_PASSWORD: koel
      MEDIA_PATH: /music
      # ePHPm serves the audio through PHP (no X-Sendfile/X-Accel module).
      STREAMING_METHOD: php
      # Cache and sessions default to the `file` driver (storage/framework).
      # To keep them in ePHPm's in-process KV store instead, uncomment:
      # CACHE_DRIVER: redis
      # SESSION_DRIVER: redis
      # REDIS_HOST: 127.0.0.1
    volumes:
      - music:/music                 # your library (bind-mount a host directory instead if you like)
      - koel-storage:/app/storage    # .env (APP_KEY), search index, cover images, uploads, logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Koel's daily jobs (library scan, pruning, podcast sync) run through the
  # Laravel scheduler, which the official image installs as a crontab.
  scheduler:
    image: recipes-koel
    command: ["sh", "-c", "while :; do ephpm php artisan schedule:run; sleep 60; done"]
    environment: *env
    volumes:
      - music:/music
      - koel-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: koel
      MARIADB_USER: koel
      MARIADB_PASSWORD: koel
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  music:
  koel-storage:
  db-data:
