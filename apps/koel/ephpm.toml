# ePHPm configuration for Koel (MySQL/MariaDB database).
#
# Koel (Laravel 13) connects to DB_HOST with pdo_mysql; ePHPm is the web
# server + PHP runtime and streams the audio (STREAMING_METHOD=php). Every
# key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Laravel's web root is public/; the application code sits above it.
document_root = "/app/public"
index_files = ["index.php"]
# nginx try_files equivalent (Koel's nginx.conf.example uses the same chain).
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 536870912           # 512 MiB — music uploads (Koel's nginx example: client_max_body_size 512M)

[server.timeouts]
request = 3600                      # long streams / uploads (Koel's nginx example: send_timeout 3600)
idle = 600

[server.static]
cache_control = "public, max-age=86400"

[php]
max_execution_time = 600            # koel:scan over HTTP-triggered uploads, long streams
memory_limit = "512M"
ini_overrides = [
    # v0.11.3 still inherits PHP's compiled-in display_errors=1 under `ephpm serve`;
    # keep warnings out of responses and in the container log
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "512M"],
    ["post_max_size", "512M"],
]

# Loopback RESP listener so `ephpm cache reset` (OPcache refresh after an
# upgrade) and `ephpm kv ...` can reach the in-process store. Not published
# outside the container. With CACHE_DRIVER=redis / SESSION_DRIVER=redis and
# REDIS_HOST=127.0.0.1 Koel uses it instead of a Redis service.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
