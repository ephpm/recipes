# Laravel on ePHPm + MariaDB — persistent worker mode (native Octane driver).
#
#   docker compose -f compose.worker.yml up -d
#
# The framework boots once per worker thread (like Octane on Swoole/
# RoadRunner); ePHPm supervises the workers. Same image as compose.yml —
# only the config file differs. Octane's usual worker-mode rules apply to
# your code (no per-request state in singletons).

services:
  ephpm:
    build: .
    image: recipes-laravel
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      EPHPM_CONFIG: /etc/ephpm/ephpm.worker.toml
      EPHPM_APP_BASE: /app
      APP_URL: http://localhost:${EPHPM_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: laravel
      MARIADB_USER: laravel
      MARIADB_PASSWORD: laravel
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  storage:
  db-data:
