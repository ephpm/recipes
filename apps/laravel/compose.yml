# Laravel on ePHPm + MariaDB (per-request mode).
#
#   docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port)
#
# Replaces: nginx + php-fpm (+ Redis for cache/sessions — see CACHE_STORE below).

services:
  ephpm:
    build: .
    image: recipes-laravel
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      APP_URL: http://localhost:${EPHPM_PORT:-8080}
      # APP_KEY: base64:...   (generated into the storage volume when unset)
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      # Cache + sessions in ePHPm's in-process KV store (no Redis container):
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional: queue worker and scheduler on the same image.
  # queue:
  #   image: recipes-laravel
  #   command: ephpm php artisan queue:work --sleep=3 --tries=3
  #   environment: *same as ephpm*
  #   volumes: [storage:/app/storage]
  #   depends_on: [ephpm]

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: laravel
      MARIADB_USER: laravel
      MARIADB_PASSWORD: laravel
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  storage:
  db-data:
