# LibreSpeed on ePHPm — single container, telemetry in LibreSpeed's own
# SQLite database (the official image's default; not experimental).
#
#   docker compose -f compose.sqlite.yml up -d
#
# Results land in /database/db.sql in the `database` volume.

services:
  ephpm:
    build: .
    image: recipes-librespeed
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      MODE: standalone
      TITLE: ${TITLE:-LibreSpeed}
      TELEMETRY: "true"
      PASSWORD: ${PASSWORD:-librespeed-stats-password}
      DB_TYPE: sqlite
      ENABLE_ID_OBFUSCATION: ${ENABLE_ID_OBFUSCATION:-false}
      REDACT_IP_ADDRESSES: ${REDACT_IP_ADDRESSES:-false}
      GDPR_EMAIL: ${GDPR_EMAIL:-}
      USE_NEW_DESIGN: ${USE_NEW_DESIGN:-false}
    volumes:
      - database:/database
    restart: unless-stopped

volumes:
  database:
