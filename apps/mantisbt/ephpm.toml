# ePHPm configuration for MantisBT (MySQL/MariaDB).
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/app"
index_files = ["index.php"]
# MantisBT's pages are real scripts (view.php?id=…). The only rewrite it
# ships is api/rest/.htaccess (Slim: anything below /api/rest/ that is not a
# file → api/rest/index.php); with a single fallback chain that front
# controller gets every unknown path, which keeps /api/rest/issues working
# and answers other unknown paths with the API's JSON 404.
fallback = ["$uri", "$uri/", "/api/rest/index.php?$query_string"]

[server.request]
max_body_size = 10485760            # 10 MiB attachments (keep in sync with the ini below; MantisBT's max_file_size is 5 MB by default)

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# The directories MantisBT ships a "Deny from all" .htaccess for, plus the
# installer/admin pages (run admin/upgrade_unattended.php from the CLI) and
# Composer's files.
blocked_paths = ["/admin/*", "/build/*", "/config/*", "/core/*", "/lang/*", "/library/*", "/plugins/*",
                 "/scripts/*", "/vendor/*", "/api/rest/restcore/*", "/composer.*", "/.git*"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "256M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "10M"],
    ["post_max_size", "10M"],
]
