# ePHPm configuration for Mautic — external database (MariaDB/MySQL).
#
# Mautic reads config/local.php (written by `mautic:install`, with the
# database settings taken from the MAUTIC_DB_* variables like the official
# image's local.php template); ePHPm is the web server + PHP runtime. Every
# key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html/docroot"
index_files = ["index.php"]
# docroot/.htaccess: everything not on disk → index.php (Symfony front controller)
fallback = ["$uri", "/index.php?$query_string"]

[server.timeouts]
request = 300                       # the official PHP_INI_VALUE_MAX_EXECUTION_TIME

[server.request]
max_body_size = 536870912           # 512 MiB — the official PHP_INI_VALUE_POST_MAX_FILESIZE

[server.static]
cache_control = "public, max-age=86400"

[server.security]
blocked_paths = ["/media/*.php*", "/media/*.phtml", "/*.htaccess"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 290                # below [server.timeouts] request so PHP's own timeout can fire
memory_limit = "512M"               # the official PHP_INI_VALUE_MEMORY_LIMIT
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    ["upload_max_filesize", "512M"],
    ["post_max_size", "512M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container (OPcache timestamp
# validation is off under `ephpm serve`; reset after installing a plugin).
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
