# MediaWiki on ePHPm + MariaDB.
#
#   docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port — keep
#                                 MEDIAWIKI_SITE_SERVER in sync with it)
#
# Replaces: Apache + mod_php (the mediawiki:apache image). Unlike the official
# image, the first start runs MediaWiki's CLI installer from the variables
# below and keeps LocalSettings.php in the `config` volume. Leave
# MEDIAWIKI_ADMIN_PASS empty to use the web installer at /mw-config/ instead
# (then copy the LocalSettings.php it produces into the `config` volume).

services:
  ephpm:
    build: .
    image: recipes-mediawiki
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      MEDIAWIKI_SITE_NAME: ${MEDIAWIKI_SITE_NAME:-ePHPm Wiki}
      MEDIAWIKI_SITE_SERVER: ${MEDIAWIKI_SITE_SERVER:-http://localhost:8080}
      MEDIAWIKI_SITE_LANG: en
      MEDIAWIKI_ADMIN_USER: ${MEDIAWIKI_ADMIN_USER:-admin}
      MEDIAWIKI_ADMIN_PASS: ${MEDIAWIKI_ADMIN_PASS:-mediawiki-admin-password}
      MEDIAWIKI_DB_TYPE: mysql
      MEDIAWIKI_DB_HOST: db
      MEDIAWIKI_DB_NAME: mediawiki
      MEDIAWIKI_DB_USER: mediawiki
      MEDIAWIKI_DB_PASSWORD: mediawiki
    volumes:
      - images:/var/www/html/images
      - config:/var/www/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: mediawiki
      MARIADB_USER: mediawiki
      MARIADB_PASSWORD: mediawiki
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  images:
  config:
  db-data:
