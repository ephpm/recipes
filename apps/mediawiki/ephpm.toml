# ePHPm configuration for MediaWiki.
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"
index_files = ["index.php"]
# Stock MediaWiki URLs (index.php?title=…). "Short URLs" (/wiki/Title) need
# a regex rewrite, and $wgUsePathInfo (index.php/Title) needs PATH_INFO —
# ePHPm provides neither, so the entrypoint sets $wgUsePathInfo = false.
fallback = ["$uri", "$uri/", "=404"]

[server.request]
max_body_size = 104857600           # 100 MiB uploads (keep in sync with the ini below)

[server.static]
cache_control = "public, max-age=3600"

[server.security]
# PHP-only directories, the config, and PHP under images/ (MediaWiki's own
# images/.htaccess switches the PHP engine off there).
blocked_paths = ["/includes/*", "/languages/*", "/maintenance/*", "/vendor/*", "/cache/*",
                 "/sql/*", "/LocalSettings.php", "/composer.*",
                 "/images/*.php", "/images/*/*.php", "/images/*/*/*.php", "/images/*/*/*/*.php",
                 "/images/deleted/*", "/images/temp/*", "/.git*"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "256M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "100M"],
    ["post_max_size", "100M"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container. Not published outside it.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
