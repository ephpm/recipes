# ePHPm configuration for Moodle.
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Moodle 5.1+ serves only public/; config.php, vendor/ and the admin CLI sit
# above it.
document_root = "/var/www/moodle/public"
index_files = ["index.php"]
# Moodle's "configured router": anything that is not a file goes to r.php
# ($CFG->routerconfigured = true in config.php).
fallback = ["$uri", "$uri/", "/r.php?$query_string"]

[server.request]
max_body_size = 104857600           # 100 MiB course files / backups

[server.timeouts]
request = 600                       # course restores and big uploads

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 300
memory_limit = "512M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    # Moodle's environment check requires at least 5000
    ["max_input_vars", "5000"],
    ["upload_max_filesize", "100M"],
    ["post_max_size", "100M"],
]

# Loopback RESP listener so `ephpm cache reset` (after installing or
# upgrading plugins — OPcache does not check timestamps under `ephpm serve`)
# and `ephpm kv ...` work inside the container. Not published.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
