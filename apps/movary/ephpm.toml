# ePHPm configuration for Movary — external database (MariaDB/MySQL) or
# Movary's own SQLite file.
#
# Movary reads its configuration from environment variables (the same ones
# the official image documents); ePHPm is the web server + PHP runtime.
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/app/public"
index_files = ["index.php"]
# The official nginx config: try_files $uri $uri/ /index.php$is_args$args
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.timeouts]
request = 300                       # imports (Trakt/Letterboxd/Plex) run in the request

[server.request]
max_body_size = 104857600           # 100 MiB — history/CSV imports

[server.static]
cache_control = "public, max-age=432000"   # the official nginx: expires 5d on assets

[server.security]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "256M"
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    ["upload_max_filesize", "100M"],
    ["post_max_size", "100M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container (OPcache timestamp
# validation is off under `ephpm serve`; reset after changing PHP files).
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
