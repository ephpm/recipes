# ePHPm configuration for OJS — external database (MariaDB/MySQL/PostgreSQL).
#
# OJS keeps its configuration in config.inc.php (written by entrypoint.sh
# from the PKP_* variables, completed by the web installer); ePHPm is the
# web server + PHP runtime. Every key is documented at
# https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"
index_files = ["ephpm-front.php"]
# The official apache.pkp.conf: RewriteCond !-d, !-f → index.php/$1. Static
# files (lib/pkp/styles, plugins/*/js, public/ uploads) are served directly;
# everything else goes through the front controller that supplies PATH_INFO.
fallback = ["$uri", "/ephpm-front.php?$query_string"]

[server.timeouts]
request = 300                       # imports, large submissions

[server.request]
max_body_size = 104857600           # 100 MiB — submission files

[server.static]
cache_control = "public, max-age=86400"
etag = true

[server.security]
# Never execute PHP from the upload directories (apache.pkp.conf: php_flag
# engine off for public/), and keep the config and cache out of the web.
blocked_paths = ["/public/*.php*", "/public/*.phtml", "/config.inc.php*", "/config.TEMPLATE.inc.php", "/cache/*", "/*.htaccess", "/index.php"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 290                # below [server.timeouts] request so PHP's own timeout can fire
memory_limit = "512M"
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    # OJS 3.5 on PHP 8.4 logs dozens of deprecation notices per request (xml_set_object, implicit nullables)
    ["error_reporting", "E_ALL & ~E_DEPRECATED"],
    ["upload_max_filesize", "100M"],
    ["post_max_size", "100M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container (OPcache timestamp
# validation is off under `ephpm serve`; reset after installing a plugin).
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
