# ePHPm configuration for OpenCart (MySQL/MariaDB).
#
# OpenCart keeps its settings in config.php / admin/config.php (written by
# the installer); ePHPm is the web server + PHP runtime. Every key is
# documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/opencart"
index_files = ["index.php"]
# OpenCart's .htaccess.txt: SEO URLs (when enabled) go to index.php.
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.timeouts]
request = 300

[server.request]
max_body_size = 33554432            # 32 MiB — image and extension uploads

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# What OpenCart's .htaccess files deny: the storage directory, templates,
# twig and ini files, and PHP under the image directory.
blocked_paths = [
    "/system/storage/*", "/system/config/*", "/*.twig", "/*.ini", "/*.log",
    "/image/*.php*", "/*.htaccess", "/config.php", "/admin/config.php",
]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 290            # below [server.timeouts] request so PHP's own timeout can fire
memory_limit = "256M"
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    ["upload_max_filesize", "32M"],
    ["post_max_size", "32M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
