# ePHPm configuration for Open Source Point of Sale (MySQL/MariaDB).
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# CodeIgniter 4's web root is public/; app/, vendor/, writable/ and .env sit
# above it and are never served.
document_root = "/app/public"
index_files = ["index.php"]
# public/.htaccess: anything that is not a file or directory goes to the
# front controller (CodeIgniter routes from REQUEST_URI).
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 33554432            # 32 MiB (item images, CSV imports)

[server.static]
cache_control = "public, max-age=604800"   # public/.htaccess: images/js/css for a week

[server.security]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120            # reports, CSV imports
memory_limit = "256M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "32M"],
    ["post_max_size", "32M"],
]
