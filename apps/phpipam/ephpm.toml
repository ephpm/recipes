# ePHPm configuration for phpIPAM (MariaDB).
[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"
index_files = ["index.php"]
# phpIPAM's .htaccess rewrites pretty URLs (/subnets/1/2/) to index.php
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 33554432

[server.static]
cache_control = "public, max-age=3600"

[server.security]
blocked_paths = ["/config.php", "/config.dist.php", "/db/*", "/functions/classes/*", "/.git*"]
# index.php, the AJAX endpoints under app/ and the API all execute
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "256M"
ini_overrides = [
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "32M"],
    ["post_max_size", "32M"],
]
