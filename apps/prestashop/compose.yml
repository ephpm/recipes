# PrestaShop on ePHPm + MariaDB.
#
#   ADMIN_MAIL=you@example.com ADMIN_PASSWD=change-me docker compose up -d
#   open http://localhost:8080                 the shop
#   open http://localhost:8080/admin-shop/     the back office (PS_FOLDER_ADMIN)
#
# Replaces: the official prestashop/prestashop image (php-apache).

services:
  ephpm:
    build: .
    image: recipes-prestashop
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      # Same variable names as prestashop/prestashop.
      DB_SERVER: db
      DB_PORT: 3306
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      DB_PREFIX: ps_
      # Install on first start with the CLI installer (the official
      # PS_INSTALL_AUTO); 0 = use the web installer at /install/.
      PS_INSTALL_AUTO: "1"
      # host[:port] customers use — PrestaShop redirects every request to it.
      PS_DOMAIN: ${PS_DOMAIN:-localhost:${EPHPM_PORT:-8080}}
      # The back-office folder is renamed to this after installing.
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN:-admin-shop}
      PS_LANGUAGE: en
      PS_COUNTRY: us
      PS_FIXTURES: "0"          # 1 = demo catalogue (JPEG images; see README)
      ADMIN_MAIL: ${ADMIN_MAIL:-demo@prestashop.com}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-prestashop_demo}
    volumes:
      - html:/var/www/prestashop      # the whole shop: config, modules, themes, images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: prestashop
      MARIADB_USER: prestashop
      MARIADB_PASSWORD: prestashop
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  html:
  db-data:
