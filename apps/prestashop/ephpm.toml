# ePHPm configuration for PrestaShop (MySQL/MariaDB).
#
# PrestaShop keeps its settings in app/config/parameters.php (written by the
# installer); ePHPm is the web server + PHP runtime. Every key is documented
# at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/prestashop"
index_files = ["index.php"]
# The installer's .htaccess sends everything that is not a file to
# index.php (friendly URLs); the back office and the Admin API are their
# own front controllers, which ephpm-front.php picks by prefix (see there).
fallback = ["$uri", "$uri/", "/ephpm-front.php?$query_string"]

[server.timeouts]
request = 300                       # module installs, imports, back-office cache rebuilds

[server.request]
max_body_size = 67108864            # 64 MiB — product images, module zips, CSV imports

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# What PrestaShop's own .htaccess files deny (app/, var/, vendor/, src/ …),
# plus no PHP from the upload directories.
blocked_paths = [
    "/app/*", "/var/*", "/vendor/*", "/src/*", "/config/*", "/classes/*",
    "/translations/*", "/cache/*", "/bin/*", "/download/*",
    "/upload/*.php*", "/img/*.php*", "/*.htaccess", "/composer.*",
]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 290            # below [server.timeouts] request so PHP's own timeout can fire
memory_limit = "512M"
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    ["upload_max_filesize", "64M"],
    ["post_max_size", "64M"],
    ["max_input_vars", "10000"],        # large back-office forms (translations, permissions)
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
