# ePHPm configuration for Pterodactyl Panel (MySQL/MariaDB + Redis).
#
# The panel (Laravel 12) connects to DB_HOST with pdo_mysql and to Redis
# with predis; ePHPm is the web server + PHP runtime. Every key is
# documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Laravel's web root is public/; the application code sits above it.
document_root = "/app/public"
index_files = ["index.php"]
# .github/docker/default.conf: try_files $uri $uri/ /index.php?$query_string
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 104857600           # client_max_body_size 100m in the official nginx config

[server.timeouts]
request = 300                       # fastcgi_read_timeout 300

[server.static]
cache_control = "public, max-age=86400"

[server.security]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 300
memory_limit = "256M"
ini_overrides = [
    # v0.11.3 still inherits PHP's compiled-in display_errors=1 under `ephpm serve`;
    # keep warnings out of responses and in the container log
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "100M"],
    ["post_max_size", "100M"],
]

# Loopback RESP listener so `ephpm cache reset` (OPcache refresh after an
# upgrade) and `ephpm kv ...` work inside the container. Not published, and
# not on 6379: the panel's cache, sessions and queue use the `cache` Redis
# service, which the queue worker and scheduler sidecars share.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6380"
