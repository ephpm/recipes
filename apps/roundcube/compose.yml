# Roundcube Webmail on ePHPm + MariaDB (+ a throwaway test mail server).
#
#   docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port)
#   log in with any address, e.g. alice@example.com, and any password
#
# Replaces: Apache + mod_php (the roundcube/roundcubemail image).
# Same variables as the official image (ROUNDCUBEMAIL_*). Roundcube is a
# client for YOUR IMAP/SMTP server: point ROUNDCUBEMAIL_DEFAULT_HOST and
# ROUNDCUBEMAIL_SMTP_SERVER at it and delete the `mail` service, which is
# GreenMail — an in-memory test server that accepts any login and keeps
# nothing. It exists so this stack runs (and is smoke-tested) out of the box.

services:
  ephpm:
    build: .
    image: recipes-roundcube
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: db
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: roundcube
      ROUNDCUBEMAIL_DB_NAME: roundcubemail
      ROUNDCUBEMAIL_DEFAULT_HOST: ${ROUNDCUBEMAIL_DEFAULT_HOST:-mail}   # your IMAP server
      ROUNDCUBEMAIL_DEFAULT_PORT: ${ROUNDCUBEMAIL_DEFAULT_PORT:-3143}
      ROUNDCUBEMAIL_SMTP_SERVER: ${ROUNDCUBEMAIL_SMTP_SERVER:-mail}     # your SMTP server
      ROUNDCUBEMAIL_SMTP_PORT: ${ROUNDCUBEMAIL_SMTP_PORT:-3025}
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
      # ROUNDCUBEMAIL_DES_KEY: ...          # otherwise generated once into the volume
      # ROUNDCUBEMAIL_USERNAME_DOMAIN: example.com
    volumes:
      - state:/var/roundcube
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: roundcubemail
      MARIADB_USER: roundcube
      MARIADB_PASSWORD: roundcube
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Throwaway IMAP/SMTP for trying Roundcube out — replace with your mail server.
  mail:
    image: docker.io/greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    restart: unless-stopped

volumes:
  state:
  db-data:
