# ePHPm configuration for Roundcube Webmail.
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Roundcube 1.7 wants public_html/ as the web root: index.php plus static.php,
# which serves skins/plugins assets from outside the web root.
document_root = "/var/www/html/public_html"
index_files = ["index.php"]
# Asset URLs look like /static.php/skins/elastic/styles/styles.min.css.
# Apache resolves that with PATH_INFO; ePHPm has no PATH_INFO, but static.php
# falls back to parsing REQUEST_URI, so route every non-file URL to it.
# (Roundcube itself is always /?_task=… → index.php via index_files.)
fallback = ["$uri", "$uri/", "/static.php?$query_string"]

[server.request]
max_body_size = 26214400            # 25 MiB attachments (keep in sync with the ini below)

[server.static]
cache_control = "public, max-age=2592000"   # public_html/.htaccess: ExpiresDefault 1 month

[server.response]
headers = [["X-Robots-Tag", "noindex, nofollow"]]

[server.security]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "256M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "25M"],
    ["post_max_size", "25M"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container. Not published outside it.
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
