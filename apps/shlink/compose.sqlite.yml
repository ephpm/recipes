# Shlink on ePHPm — single container, Shlink's own SQLite database.
#
#   INITIAL_API_KEY=change-me docker compose -f compose.sqlite.yml up -d
#
# No database server at all: Shlink supports SQLite natively (pdo_sqlite is
# compiled into ePHPm) and keeps the file at data/database.sqlite in the
# data volume. This is Shlink's documented small-install option, not ePHPm's
# experimental embedded engine.

services:
  ephpm:
    build: .
    image: recipes-shlink
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:8080}
      IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED:-false}
      # DB_DRIVER unset = sqlite
      INITIAL_API_KEY: ${INITIAL_API_KEY:-}
    volumes:
      - data:/etc/shlink/data
    restart: unless-stopped

volumes:
  data:
