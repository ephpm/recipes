# ePHPm configuration for Slim 4 — per-request mode.
# Keys: https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/app/public"
index_files = ["index.php"]
# nginx `try_files $uri /index.php$is_args$args`
fallback = ["$uri", "/index.php?$query_string"]

[server.security]
blocked_paths = ["/app/*", "/var/*", "/vendor/*", "/logs/*"]
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 30
memory_limit = "128M"
# v0.11.3 still inherits PHP's compiled-in display_errors=1 under `serve`
# (later releases default it Off); keep notices out of responses explicitly.
ini_overrides = [["display_errors", "Off"], ["log_errors", "On"]]

[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
