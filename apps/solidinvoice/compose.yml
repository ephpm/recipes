# SolidInvoice on ePHPm + MariaDB.
#
#   ADMIN_EMAIL=you@example.com ADMIN_PASSWORD=change-me docker compose up -d
#   open http://localhost:8080
#
# Replaces: the official solidinvoice/solidinvoice image (static FrankenPHP
# binary + Caddy) and its docker-compose.yml.

services:
  ephpm:
    build: .
    image: recipes-solidinvoice
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      # SolidInvoice itself reads SOLIDINVOICE_* (set in the image); these
      # drive the one-time `app:install` the entrypoint runs.
      DATABASE_DRIVER: pdo_mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: solidinvoice
      DATABASE_USER: solidinvoice
      DATABASE_PASSWORD: solidinvoice
      APPLICATION_URL: ${APPLICATION_URL:-http://localhost:8080}
      # First admin account; leave unset to use the web installer at /install instead.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOCALE: en
      DISABLE_TELEMETRY: "1"
    volumes:
      - config:/etc/solidinvoice
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: solidinvoice
      MARIADB_USER: solidinvoice
      MARIADB_PASSWORD: solidinvoice
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  config:
  db-data:
