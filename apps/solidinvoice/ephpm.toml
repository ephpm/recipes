# ePHPm configuration for SolidInvoice — external database (MariaDB/MySQL).
#
# SolidInvoice keeps its configuration in the SOLIDINVOICE_CONFIG_DIR vault
# (written by `app:install`); ePHPm is the web server + PHP runtime. Every
# key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
document_root = "/app/public"
index_files = ["index.php"]
# The official Caddyfile serves public/ with php_server (Symfony's index.php
# for anything not on disk) — the same as nginx try_files $uri /index.php.
fallback = ["$uri", "/index.php?$query_string"]

[server.timeouts]
request = 300                       # PDF generation and e-mail sending run in the request

[server.request]
max_body_size = 67108864            # 64 MiB — logo/attachment uploads, imports

[server.static]
cache_control = "public, max-age=604800"   # public/static assets are content-hashed

[server.security]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "512M"
ini_overrides = [
    ["display_errors", "Off"],          # v0.11.3 still ships PHP's display_errors=1 under serve
    ["log_errors", "On"],
    ["upload_max_filesize", "64M"],
    ["post_max_size", "64M"],
    ["date.timezone", "UTC"],
]

# Loopback RESP listener so `ephpm kv ...` and `ephpm cache reset` can reach
# the in-process store from inside the container (OPcache timestamp
# validation is off under `ephpm serve`; reset after changing PHP files).
[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"
