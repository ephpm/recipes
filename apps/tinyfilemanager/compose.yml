# Tiny File Manager on ePHPm.
#
#   TFM_ADMIN_PASSWORD='something-long' docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port)
#
# Replaces: the tinyfilemanager/tinyfilemanager image (php -S on PHP 7.4).

services:
  ephpm:
    build: .
    image: recipes-tinyfilemanager
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      TFM_ADMIN_USER: ${TFM_ADMIN_USER:-admin}
      # Plain password (hashed at start) or TFM_ADMIN_PASSWORD_HASH (a
      # password_hash() value). Neither set: one is generated and logged.
      TFM_ADMIN_PASSWORD: ${TFM_ADMIN_PASSWORD:-}
      # TFM_READONLY_USER: viewer
      # TFM_READONLY_PASSWORD: ...
      # TFM_ALLOWED_UPLOAD_EXTENSIONS: "jpg,png,pdf,txt"
      TZ: Etc/UTC
    volumes:
      - data:/data            # the files being managed (or bind-mount a host directory)
    restart: unless-stopped

volumes:
  data:
