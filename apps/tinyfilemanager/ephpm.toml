# ePHPm configuration for Tiny File Manager.
# Every key is documented at https://ephpm.dev/reference/config/

[server]
listen = "0.0.0.0:8080"
# Only index.php (the app) and translation.json are in /app; the managed
# files are in /data, which is not under the document root.
document_root = "/app"
index_files = ["index.php"]
# Every request is index.php?p=…; anything else is a 404.
fallback = ["$uri", "$uri/", "=404"]

[server.request]
# Uploads arrive in 2 MB chunks (the app's $upload_chunk_size_bytes);
# leave headroom for multipart overhead.
max_body_size = 16777216            # 16 MiB

[server.security]
# config.php holds the password hashes; it is PHP, but never needs serving.
blocked_paths = ["/config.php"]
# These three only act in multi-tenant (sites_dir) mode; set explicitly so
# ePHPm does not warn about them being inert on this single-site deployment.
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 240            # zip/tar of large folders
memory_limit = "256M"
ini_overrides = [
    # ePHPm v0.11.3 still inherits PHP's compiled-in display_errors=1 under
    # `serve`; keep warnings out of responses and in the container log.
    ["display_errors", "Off"],
    ["log_errors", "On"],
    ["upload_max_filesize", "16M"],
    ["post_max_size", "16M"],
]
