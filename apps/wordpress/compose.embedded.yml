# WordPress on ePHPm — single container, embedded database. EXPERIMENTAL.
#
#   docker compose -f compose.embedded.yml up -d
#
# No MariaDB: ePHPm's embedded SQLite-compatible engine (Turso, Beta) answers
# on the MySQL wire protocol inside the container. Suitable for dev, previews
# and small sites; back up /var/lib/ephpm.

services:
  ephpm:
    build: .
    image: recipes-wordpress
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      EPHPM_CONFIG: /etc/ephpm/ephpm.embedded.toml
    volumes:
      - wp-content:/var/www/html/wp-content
      - ephpm-data:/var/lib/ephpm
    restart: unless-stopped

volumes:
  wp-content:
  ephpm-data:
