# WordPress on ePHPm + MariaDB.
#
#   docker compose up -d
#   open http://localhost:8080   (EPHPM_PORT overrides the host port)
#
# Replaces: nginx/apache + php-fpm + redis (object cache) + the WordPress image.

services:
  ephpm:
    build: .
    image: recipes-wordpress
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # WORDPRESS_DEBUG: "1"
      # WORDPRESS_CONFIG_EXTRA: "define('WP_HOME', 'https://example.com');"
    volumes:
      - wp-content:/var/www/html/wp-content
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  wp-content:
  db-data:
