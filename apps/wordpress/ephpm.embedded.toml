# ePHPm configuration for WordPress — single container, embedded database.
#
# EXPERIMENTAL. No MySQL container: ePHPm opens an embedded SQLite-compatible
# database (the Turso engine, Beta upstream) and exposes it on the MySQL wire
# protocol at 127.0.0.1:3306, where WordPress's stock mysqli driver connects.
# wp-config.php's defaults (DB_HOST 127.0.0.1:3306, user root, empty password)
# already point here. The database file lives in /var/lib/ephpm (a volume).

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"
index_files = ["index.php", "index.html"]
fallback = ["$uri", "$uri/", "/index.php?$query_string"]

[server.request]
max_body_size = 67108864

[server.static]
cache_control = "public, max-age=3600"

[server.security]
blocked_paths = ["/wp-content/uploads/*.php", "/xmlrpc.php"]
open_basedir = false
disable_shell_exec = false
multi_tenant_hardening = false

[php]
max_execution_time = 120
memory_limit = "256M"
ini_overrides = [
    ["upload_max_filesize", "64M"],
    ["post_max_size", "64M"],
]

[kv.redis_compat]
enabled = true
listen = "127.0.0.1:6379"

[db.sqlite]
path = "/var/lib/ephpm/wordpress.db"

[db.sqlite.proxy]
mysql_listen = "127.0.0.1:3306"
