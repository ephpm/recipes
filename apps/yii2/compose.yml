# Yii 2 basic app on ePHPm + MariaDB.
#
#   docker compose up -d
#   open http://localhost:8080   (login: admin / admin, demo / demo)
#
# Replaces: the yiisoftware/yii2-php apache image (apache + mod_php).

services:
  ephpm:
    build: .
    image: recipes-yii2
    ports:
      - "${EPHPM_PORT:-8080}:8080"
    environment:
      YII_ENV: prod
      YII_DEBUG: "0"
      # COOKIE_VALIDATION_KEY: <random string>   (generated into the runtime volume when unset)
      DB_DSN: "mysql:host=db;port=3306;dbname=yii2basic"
      DB_USER: yii
      DB_PASSWORD: yii
    volumes:
      - runtime:/app/runtime
      - assets:/app/web/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: yii2basic
      MARIADB_USER: yii
      MARIADB_PASSWORD: yii
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  runtime:
  assets:
  db-data:
